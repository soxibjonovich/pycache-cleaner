[project]
name = "pycache-cleaner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soxibjonovich", email = "makhmud.dev09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "icecream>=2.1.3",
]

[project.scripts]
pyclean = "pycache_cleaner.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pycache-cleaner",
]

[tool.uv.sources]
pycache-cleaner = { workspace = true }
